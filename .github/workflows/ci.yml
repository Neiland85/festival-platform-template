name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0
        continue-on-error: true

      - name: Test
        run: pnpm test:unit
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-minimum-32-characters-long
          ADMIN_PASSWORD: ci-test-admin
