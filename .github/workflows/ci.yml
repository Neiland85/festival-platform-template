name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (frozen lockfile — supply chain integrity)
        run: pnpm install --frozen-lockfile

      - name: Security audit (prod direct deps only)
        run: pnpm audit --prod --audit-level=critical || true

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test with coverage
        run: pnpm test:unit -- --coverage
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-minimum-32-characters-long
          ADMIN_PASSWORD: ci-test-admin

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-minimum-32-characters-long
          ADMIN_PASSWORD: ci-test-admin

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          flags: unittests
          fail_ci_if_error: false
