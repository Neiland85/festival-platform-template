name: Upload Hero Assets

on:
  push:
    branches: [main]
    paths:
      - "public/hero/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-upload all assets"
        required: false
        default: false
        type: boolean

concurrency:
  group: assets-upload
  cancel-in-progress: false

permissions:
  contents: read

env:
  S3_BUCKET: festival-hero-assets
  AWS_REGION: eu-west-1
  CDN_DOMAIN: ""

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect changed hero assets
        id: changes
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            FILES=$(find public/hero -type f)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- 'public/hero/' || true)
          fi

          if [[ -z "$FILES" ]]; then
            echo "count=0" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "count=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload changed assets to S3
        if: steps.changes.outputs.count != '0'
        run: |
          set -e

          content_type_for() {
            case "${1##*.}" in
              mp4) echo "video/mp4" ;;
              webm) echo "video/webm" ;;
              mov) echo "video/quicktime" ;;
              jpg|jpeg) echo "image/jpeg" ;;
              png) echo "image/png" ;;
              webp) echo "image/webp" ;;
              avif) echo "image/avif" ;;
              svg) echo "image/svg+xml" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          while read -r file; do
            [[ -f "$file" ]] || continue

            filename=$(basename "$file")
            ct=$(content_type_for "$filename")

            aws s3 cp "$file" "s3://${S3_BUCKET}/hero/${filename}" \
              --content-type "$ct" \
              --cache-control "public, max-age=31536000, immutable"
          done <<< "${{ steps.changes.outputs.files }}"

      - name: Invalidate CloudFront cache
        if: steps.changes.outputs.count != '0' && env.CDN_DOMAIN != ''
        run: |
          if [[ -n "${{ secrets.CDN_DISTRIBUTION_ID }}" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ secrets.CDN_DISTRIBUTION_ID }}" \
              --paths "/hero/*"
          fi

      - name: Summary
        if: steps.changes.outputs.count != '0'
        run: |
          BASE="https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/hero/"
          echo "### Assets uploaded" >> $GITHUB_STEP_SUMMARY
